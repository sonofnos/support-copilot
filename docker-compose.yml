services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support_copilot
    ports:
      - "5436:5432"
    volumes:
      - support_copilot_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - support_copilot_qdrant:/qdrant/storage

volumes:
  support_copilot_pg:
  support_copilot_qdrant:
