name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      # Tests spin up their own Postgres/Redis/Qdrant via Testcontainers
      # (test/integration/setup.ts) - GitHub's ubuntu-latest runners ship
      # with Docker preinstalled, so no service containers are declared here.
      - run: npm test
